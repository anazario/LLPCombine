      - *baseline_cuts
      - *Cleaning
      - *kinDelPho
      - *b10
      - *noSV
      - *geq1PhoTightIsoEarly

  # \u2500\u2500 Ch 4: Delayed Photon + 0 SV \u2014
  Eq2Pho_MedIsoCR00:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kinEq2Pho
      - *b00
      - *noSV
      - *eq2Pho
      - *phoCR_eq2prompt
      - *noBHPhotons
      - *noNonPromptPhotons
      
  Eq2Pho_MedIsoCR10:
    cuts:
      - *baseline_cuts
      - *Cleaning
