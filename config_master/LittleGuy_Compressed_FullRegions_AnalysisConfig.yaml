      - *Cleaning
      - *kinEq2Pho
      - *b30p
      - *noSV
      - *eq2Pho
      - *phoCR_eq2prompt
      - *noBHPhotons
      - *noNonPromptPhotons

  Eq2Pho_TightIsoCR00:
    cuts:
      - *baseline_cuts
      - *Cleaning
      - *kinEq2Pho
      - *b00
      - *noSV
      - *eq2Pho
      - *phoSR_eq2prompt
